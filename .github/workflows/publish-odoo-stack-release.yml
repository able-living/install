name: Publish Odoo Stack launcher release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-odoo-stack-launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Validate launcher
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          bash -n odoo-stack
          shellcheck odoo-stack

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          sha256sum odoo-stack > odoo-stack.sha256
          args=(gh release create "$TAG" odoo-stack odoo-stack.sha256
            --verify-tag
            --title "Able Living installer launcher $TAG"
            --generate-notes)
          case "$TAG" in
            *-alpha.*|*-beta.*|*-rc.*) args+=(--prerelease --latest=false) ;;
            *) args+=(--latest) ;;
          esac
          "${args[@]}"
